name: CI Load Test
on:
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    # Grant permissions to post the PR comment
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.4.0
        with:
          config: kind-config.yaml

      - name: Deploy NGINX Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
          # Small buffer for NGINX to start listening
          sleep 10

      - name: Deploy Applications
        run: |
          kubectl apply -f k8s/apps.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl wait --for=condition=available deployment/foo --timeout=60s
          kubectl wait --for=condition=available deployment/bar --timeout=60s

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Load Test
        id: k6test
        run: |
            # Force remove any old results to ensure we aren't reading "ghost" data
            rm -f result.json
            k6 run scripts/load-test.js --summary-export=result.json
            # Debug: Show the file exists and its size
            ls -lh result.json

      - name: Post Results to PR
        uses: actions/github-script@v6
        if: always()
        with:
            script: |
              const fs = require('fs');
              // Read and parse the file
              const fileContent = fs.readFileSync('./result.json', 'utf8');
              const data = JSON.parse(fileContent);
              const m = data.metrics;
              
              // Extract metrics using safe string keys
              const avgVal = m['http_req_duration']?.values?.avg;
              const p95Val = m['http_req_duration']?.values?.['p(95)'];
              const rateVal = m['http_reqs']?.values?.rate || 0;
              const countVal = m['http_reqs']?.values?.count || 0;
              const failPasses = m['http_req_failed']?.values?.passes || 0;
              
              // Calculate success rate
              const successPct = countVal > 0 
                ? (((countVal - failPasses) / countVal) * 100).toFixed(2) 
                : "0.00";
              
              // Build the comment body WITHOUT using ${} to avoid GitHub Action conflicts
              let body = "### 🚀 Load Test Results\n";
              body += "- **Avg Latency:** " + (avgVal ? avgVal.toFixed(2) + "ms" : "N/A") + "\n";
              body += "- **P95 Latency:** " + (p95Val ? p95Val.toFixed(2) + "ms" : "N/A") + "\n";
              body += "- **Requests/sec:** " + Number(rateVal).toFixed(2) + "\n";
              body += "- **Success Rate:** " + successPct + "%";
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });