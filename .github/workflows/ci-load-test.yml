name: CI Load Test
on:
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    # Grant permissions to post the PR comment
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.4.0
        with:
          config: kind-config.yaml

      - name: Deploy NGINX Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
          # Small buffer for NGINX to start listening
          sleep 10

      - name: Deploy Applications
        run: |
          kubectl apply -f k8s/apps.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl wait --for=condition=available deployment/foo --timeout=60s
          kubectl wait --for=condition=available deployment/bar --timeout=60s

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Load Test
        id: k6test
        run: |
            # Force remove any old results to ensure we aren't reading "ghost" data
            rm -f result.json
            k6 run scripts/load-test.js --summary-export=result.json
            # Debug: Show the file exists and its size
            ls -lh result.json

      - name: Post Results to PR
        uses: actions/github-script@v6
        if: always()
        with:
            script: |
              const fs = require('fs');
              const file = fs.readFileSync('./result.json', 'utf8');
              const data = JSON.parse(file);
              const m = data.metrics;
              
              // Extract values using safe string keys
              const a = m['http_req_duration'] && m['http_req_duration'].values ? m['http_req_duration'].values.avg : null;
              const p = m['http_req_duration'] && m['http_req_duration'].values ? m['http_req_duration'].values['p(95)'] : null;
              const r = m['http_reqs'] && m['http_reqs'].values ? m['http_reqs'].values.rate : 0;
              const c = m['http_reqs'] && m['http_reqs'].values ? m['http_reqs'].values.count : 0;
              const f = m['http_req_failed'] && m['http_req_failed'].values ? m['http_req_failed'].values.passes : 0;
              
              const s = c > 0 ? (((c - f) / c) * 100).toFixed(2) : "0.00";
              
              // Build the body using ONLY string concatenation (+) to avoid GitHub Variable interference
              var comment = "### 🚀 Load Test Results\n";
              comment += "- **Avg Latency:** " + (a ? a.toFixed(2) + "ms" : "N/A") + "\n";
              comment += "- **P95 Latency:** " + (p ? p.toFixed(2) + "ms" : "N/A") + "\n";
              comment += "- **Requests/sec:** " + Number(r).toFixed(2) + "\n";
              comment += "- **Success Rate:** " + s + "%";
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });