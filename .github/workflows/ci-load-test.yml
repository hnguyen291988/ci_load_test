name: CI Load Test
on:
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    # Grant permissions to post the PR comment
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.4.0
        with:
          config: kind-config.yaml

      - name: Deploy NGINX Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
          # Small buffer for NGINX to start listening
          sleep 10

      - name: Deploy Applications
        run: |
          kubectl apply -f k8s/apps.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl wait --for=condition=available deployment/foo --timeout=60s
          kubectl wait --for=condition=available deployment/bar --timeout=60s

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Load Test
        id: k6test
        run: |
            # Force remove any old results to ensure we aren't reading "ghost" data
            rm -f result.json
            k6 run scripts/load-test.js --summary-export=result.json
            # Debug: Show the file exists and its size
            ls -lh result.json

      - name: Post Results to PR
        uses: actions/github-script@v6
        if: always() # Ensure this runs even if k6 has 10% failures
        with:
            script: |
                  const fs = require('fs');
                  const path = './result.json';
                  
                  if (!fs.existsSync(path)) {
                    core.setFailed('CRITICAL: result.json was never created!');
                    return;
                  }
                  
                  const rawData = fs.readFileSync(path, 'utf8');
                  console.log("Raw Data Check:", rawData.substring(0, 100)); // Debug log
                  
                  const results = JSON.parse(rawData);
                  
                  // k6 JSON structure can be nested; let's extract carefully
                  const metrics = results.metrics || {};
                  
                  // Extract with explicit fallbacks to 'N/A' or 0
                  const avg = metrics.http_req_duration?.values?.avg ? metrics.http_req_duration.values.avg.toFixed(2) : 'N/A';
                  const p95 = metrics.http_req_duration?.values?.['p(95)'] ? metrics.http_req_duration.values['p(95)'].toFixed(2) : 'N/A';
                  const rate = metrics.http_reqs?.values?.rate ? metrics.http_reqs.values.rate.toFixed(2) : '0';
                  
                  const fails = metrics.http_req_failed?.values?.fails || 0;
                  const count = metrics.http_reqs?.values?.count || 0;
                  const success = count > 0 ? ((1 - (fails / count)) * 100).toFixed(2) : '0';
                  
                  const commentBody = [
                    '### 🚀 Load Test Results',
                    `- **Avg Latency:** ${avg}ms`,
                    `- **P95 Latency:** ${p95}ms`,
                    `- **Requests/sec:** ${rate}`,
                    `- **Success Rate:** ${success}%`
                  ].join('\n');
                  
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });